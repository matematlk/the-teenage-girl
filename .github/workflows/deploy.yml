name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Debug
        run: |
          pwd
          ls -la
          ls -la the-teenage-girl

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Generate manifests
        run: sh generate-manifests.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-teenage-girl/package-lock.json

      - name: Build Tailwind
        working-directory: the-teenage-girl
        run: |
          npm ci
          npx @tailwindcss/cli -i wwwroot/src/input.css -o wwwroot/src/output.css --minify

      - name: Publish
        run: dotnet publish the-teenage-girl/the-teenage-girl.csproj -c Release -o release --nologo
        
      - name: Debug Tailwind
        run: ls -la release/wwwroot/src

      - name: Change base-href
        run: sed -i 's/<base href="\/" \/>/<base href="\/the-teenage-girl\/" \/>/g' release/wwwroot/index.html

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
